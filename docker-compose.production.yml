services:
  lablink:
    build: .
    ports:
      - '127.0.0.1:3001:3001'
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set the exact public HTTPS URL in .env}
      DATABASE_PATH: /var/lib/lablink/root.sqlite
      WORKSPACE_REGISTRY_PATH: /var/lib/lablink/workspaces.sqlite
      WORKSPACE_DIRECTORY: /var/lib/lablink/workspaces
      LABLINK_DELIVERY_MODE: preview
    volumes:
      - lablink-data:/var/lib/lablink
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  lablink-data:
